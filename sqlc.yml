version: "2"

overrides:
  go:
    overrides:
      - db_type: "uuid"
        go_type:
          import: "github.com/google/uuid"
          type  : "UUID"
      - db_type: "uuid"
        nullable: true
        go_type:
          import : "github.com/google/uuid"
          type   : "UUID"
          pointer: true

      - db_type: "timestamptz"
        go_type:
          import: "time"
          type: "Time"
      - db_type: "timestamptz"
        nullable: true
        go_type:
          import: "time"
          type: "Time"
          pointer: true

      # jsonb giữ nguyên bytes, repository tự decode
      - db_type: "jsonb"
        go_type:
          import: "encoding/json"
          type: "RawMessage"
      - db_type: "jsonb"
        nullable: true
        go_type:
          import: "encoding/json"
          type: "RawMessage"

sql:
  # Schema lấy từ migrations/ (sqlc bỏ qua phần -- +goose Down)
  - engine: "postgresql"
    schema: "migrations"
    queries: "events/queries"
    gen:
      go:
        package: "db"
        out: "events/db"
        sql_package: "pgx/v5"
        emit_interface: true
        # [] thay vì nil với param dạng :many
        emit_empty_slices: true
        emit_pointers_for_null_types: true
